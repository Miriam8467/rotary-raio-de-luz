<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Rotary Raio de Luz</title>

    <style>

        /* ==================================================
           RESET
        ================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        /* ==================================================
           PÁGINA
        ================================================== */

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #edf5fb 0%,
                    #f8fbfd 50%,
                    #e9f3fa 100%
                );

            color: #1f2937;

            overflow-x: hidden;
            overflow-y: auto;
        }


        /* ==================================================
           ÁREA DO LOGIN
        ================================================== */

        .pagina-login {

            width: 100%;
            min-height: 100vh;

            display: flex;

            align-items: center;
            justify-content: center;

            padding: 30px 20px;
        }


        /* ==================================================
           CARTÃO PRINCIPAL
        ================================================== */

        .cartao-login {

            position: relative;

            width: 760px;

            max-width: calc(100vw - 40px);

            min-height: 680px;

            background: #ffffff;

            border-radius: 24px;

            padding:
                30px
                55px
                85px
                55px;

            box-shadow:
                0 18px 45px rgba(
                    30,
                    75,
                    115,
                    0.14
                );

            overflow: hidden;
        }


        /* ==================================================
           LOGO
        ================================================== */

        .logo-login-area {

            width: 100%;

            height: 125px;

            display: flex;

            align-items: center;
            justify-content: center;

            margin-bottom: 5px;
        }

        .logo-login-img {

            display: block;

            width: 330px;

            max-width: 70%;

            height: auto;

            object-fit: contain;
        }


        /* ==================================================
           TEXTO "BEM-VINDO"
        ================================================== */

        .linha-superior {

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 12px;

            margin-bottom: 8px;
        }

        .linha-superior::before,
        .linha-superior::after {

            content: "";

            width: 55px;

            height: 2px;

            background: #d6dee7;
        }

        .linha-superior span {

            font-size: 12px;

            font-weight: 700;

            letter-spacing: 2.5px;

            color: #66788c;

            white-space: nowrap;
        }


        /* ==================================================
           TÍTULO
        ================================================== */

        .titulo-login {

            width: 100%;

            text-align: center;

            font-size: 38px;

            line-height: 1.15;

            font-weight: 700;

            color: #205a91;

            margin-bottom: 5px;

            white-space: nowrap;
        }


        /* ==================================================
           SUBTÍTULO
        ================================================== */

        .subtitulo-login {

            width: 100%;

            text-align: center;

            font-size: 18px;

            color: #687789;

            margin-bottom: 30px;
        }


        /* ==================================================
           FORMULÁRIO
        ================================================== */

        .form-login {

            width: 100%;

            max-width: 620px;

            margin: 0 auto;
        }


        /* ==================================================
           CAMPOS
        ================================================== */

        .campo-login {

            width: 100%;

            margin-bottom: 20px;
        }

        .campo-login label {

            display: block;

            margin-bottom: 7px;

            font-size: 16px;

            font-weight: 700;

            color: #293b4d;
        }


        /* ==================================================
           ÁREA DO INPUT
        ================================================== */

        .campo-input-login {

            position: relative;

            width: 100%;
        }


        /* ==================================================
           ÍCONES
        ================================================== */

        .icone-campo {

            position: absolute;

            left: 17px;

            top: 50%;

            transform: translateY(-50%);

            width: 21px;
            height: 21px;

            color: #68788a;

            pointer-events: none;

            z-index: 2;
        }

        .icone-campo svg {

            width: 100%;
            height: 100%;

            display: block;

            fill: none;

            stroke: currentColor;

            stroke-width: 1.8;

            stroke-linecap: round;

            stroke-linejoin: round;
        }


        /* ==================================================
           INPUT
        ================================================== */

        .input-login {

            display: block;

            width: 100%;

            height: 58px;

            border: 1px solid #d2dbe5;

            border-radius: 11px;

            background: #f9fbfd;

            color: #263746;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-size: 16px;

            padding:
                0
                55px
                0
                53px;

            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }

        .input-login::placeholder {

            color: #98a7b9;
        }

        .input-login:focus {

            border-color: #2874b5;

            background: #ffffff;

            box-shadow:
                0 0 0 3px rgba(
                    40,
                    116,
                    181,
                    0.10
                );
        }


        /* ==================================================
           BOTÃO DO OLHO
        ================================================== */

        .botao-olho-login {

            position: absolute;

            right: 15px;

            top: 50%;

            transform: translateY(-50%);

            width: 30px;
            height: 30px;

            display: flex;

            align-items: center;
            justify-content: center;

            border: none;

            background: transparent;

            padding: 0;

            margin: 0;

            color: #68788a;

            cursor: pointer;

            appearance: none;

            -webkit-appearance: none;

            outline: none;
        }

        .botao-olho-login:hover {

            color: #205a91;
        }

        .botao-olho-login svg {

            width: 21px;
            height: 21px;

            display: block;

            fill: none;

            stroke: currentColor;

            stroke-width: 1.8;

            stroke-linecap: round;

            stroke-linejoin: round;
        }


        /* ==================================================
           BOTÃO ENTRAR
        ================================================== */

        .btn-login {

            width: 100%;

            height: 60px;

            margin-top: 5px;

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 10px;

            border: none;

            border-radius: 11px;

            background: #2473b2;

            color: #ffffff;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-size: 19px;

            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 7px 16px rgba(
                    36,
                    115,
                    178,
                    0.20
                );

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }

        .btn-login:hover {

            background: #1c6199;

            transform: translateY(-1px);
        }

        .btn-login:active {

            transform: translateY(0);
        }

        .btn-login:disabled {

            opacity: 0.7;

            cursor: wait;

            transform: none;
        }

        .seta-login {

            font-size: 21px;

            line-height: 1;
        }


        /* ==================================================
           MENSAGEM
        ================================================== */

        .mensagem-login {

            min-height: 20px;

            margin-top: 10px;

            text-align: center;

            font-size: 13px;

            font-weight: 600;
        }

        .mensagem-login.sucesso {

            color: #16803d;
        }

        .mensagem-login.erro {

            color: #d62828;
        }


        /* ==================================================
           RODAPÉ
        ================================================== */

        .rodape-login {

            position: absolute;

            left: 0;
            right: 0;

            bottom: 32px;

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 12px;

            color: #718196;

            font-size: 10px;

            font-weight: 700;

            letter-spacing: 2.2px;

            text-align: center;
        }

        .rodape-login::before,
        .rodape-login::after {

            content: "";

            width: 55px;

            height: 1px;

            background: #d5dee7;
        }


        /* ==================================================
           FAIXA INFERIOR
        ================================================== */

        .decoracao-login {

            position: absolute;

            left: 0;
            right: 0;
            bottom: 0;

            height: 9px;

            display: flex;
        }

        .decoracao-login .azul {

            flex: 1;

            background: #2473b2;
        }

        .decoracao-login .amarelo {

            width: 24%;

            background: #f4c542;
        }


        /* ==================================================
           TELAS MÉDIAS
        ================================================== */

        @media screen and (max-width: 850px) {

            .cartao-login {

                width: 700px;

                max-width: calc(100vw - 40px);

                padding:
                    28px
                    45px
                    82px
                    45px;
            }

            .logo-login-img {

                width: 300px;
            }

            .titulo-login {

                font-size: 34px;
            }

            .form-login {

                max-width: 580px;
            }
        }


        /* ==================================================
           TABLET
        ================================================== */

        @media screen and (max-width: 700px) {

            .pagina-login {

                padding: 20px 15px;

                align-items: center;
            }

            .cartao-login {

                width: 100%;

                max-width: 560px;

                min-height: auto;

                padding:
                    28px
                    30px
                    82px
                    30px;
            }

            .logo-login-area {

                height: 105px;
            }

            .logo-login-img {

                width: 270px;

                max-width: 75%;
            }

            .titulo-login {

                font-size: 30px;

                white-space: normal;
            }

            .subtitulo-login {

                font-size: 17px;

                margin-bottom: 25px;
            }

            .form-login {

                max-width: 100%;
            }
        }


        /* ==================================================
           CELULAR
        ================================================== */

        @media screen and (max-width: 500px) {

            .pagina-login {

                padding: 15px 10px;
            }

            .cartao-login {

                max-width: 100%;

                border-radius: 19px;

                padding:
                    24px
                    20px
                    78px
                    20px;
            }

            .logo-login-area {

                height: 90px;
            }

            .logo-login-img {

                width: 230px;

                max-width: 85%;
            }

            .linha-superior {

                gap: 7px;
            }

            .linha-superior::before,
            .linha-superior::after {

                width: 30px;
            }

            .linha-superior span {

                font-size: 9px;

                letter-spacing: 1.4px;
            }

            .titulo-login {

                font-size: 27px;
            }

            .subtitulo-login {

                font-size: 16px;
            }

            .campo-login label {

                font-size: 15px;
            }

            .input-login {

                height: 55px;

                font-size: 15px;
            }

            .btn-login {

                height: 56px;

                font-size: 18px;
            }

            .rodape-login {

                bottom: 28px;

                font-size: 8px;

                letter-spacing: 1.3px;

                gap: 6px;
            }

            .rodape-login::before,
            .rodape-login::after {

                width: 25px;
            }
        }


        /* ==================================================
           CELULAR MUITO PEQUENO
        ================================================== */

        @media screen and (max-width: 360px) {

            .cartao-login {

                padding-left: 16px;
                padding-right: 16px;
            }

            .titulo-login {

                font-size: 24px;
            }

            .logo-login-img {

                width: 210px;
            }
        }

    </style>

</head>


<body>


    <main class="pagina-login">


        <section class="cartao-login">


            <!-- ==========================================
                 LOGO
            =========================================== -->

            <div class="logo-login-area">

                <img
                    src="logo.png"
                    alt="Rotary Club de Campo Mourão - Raio de Luz"
                    class="logo-login-img"
                >

            </div>


            <!-- ==========================================
                 TÍTULO
            =========================================== -->

            <div class="linha-superior">

                <span>
                    BEM-VINDO AO SISTEMA
                </span>

            </div>


            <h1 class="titulo-login">
                Rotary Raio de Luz
            </h1>

            <!-- ==========================================
                 FORMULÁRIO
            =========================================== -->

            <form
                id="loginForm"
                class="form-login"
            >


                <!-- E-MAIL -->

                <div class="campo-login">

                    <label for="email">
                        E-mail
                    </label>


                    <div class="campo-input-login">

                        <span class="icone-campo">

                            <svg
                                viewBox="0 0 24 24"
                                aria-hidden="true"
                            >

                                <rect
                                    x="3"
                                    y="5"
                                    width="18"
                                    height="14"
                                    rx="2"
                                ></rect>

                                <path
                                    d="M3 7l9 6 9-6"
                                ></path>

                            </svg>

                        </span>


                        <input
                            type="email"
                            id="email"
                            name="email"
                            class="input-login"
                            placeholder="Digite seu e-mail"
                            autocomplete="email"
                            required
                        >

                    </div>

                </div>


                <!-- SENHA -->

                <div class="campo-login">

                    <label for="senha">
                        Senha
                    </label>


                    <div class="campo-input-login">


                        <span class="icone-campo">

                            <svg
                                viewBox="0 0 24 24"
                                aria-hidden="true"
                            >

                                <rect
                                    x="4"
                                    y="10"
                                    width="16"
                                    height="10"
                                    rx="2"
                                ></rect>

                                <path
                                    d="M8 10V7a4 4 0 018 0v3"
                                ></path>

                                <circle
                                    cx="12"
                                    cy="15"
                                    r="1"
                                ></circle>

                            </svg>

                        </span>


                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            class="input-login"
                            placeholder="Digite sua senha"
                            autocomplete="current-password"
                            required
                        >


                        <!-- OLHO -->

                        <button
                            type="button"
                            id="btnMostrarSenha"
                            class="botao-olho-login"
                            aria-label="Mostrar senha"
                            title="Mostrar senha"
                        >

                            <svg
                                id="iconeOlho"
                                viewBox="0 0 24 24"
                                aria-hidden="true"
                            >

                                <path
                                    d="M2 12s3.5-6 10-6
                                       10 6 10 6
                                       -3.5 6-10 6
                                       -10-6-10-6z"
                                ></path>

                                <circle
                                    cx="12"
                                    cy="12"
                                    r="2.5"
                                ></circle>

                            </svg>

                        </button>

                    </div>

                </div>


                <!-- BOTÃO -->

                <button
                    type="submit"
                    id="btnLogin"
                    class="btn-login"
                >

                    <span>
                        Entrar
                    </span>

                    <span
                        class="seta-login"
                        aria-hidden="true"
                    >
                        →
                    </span>

                </button>


                <!-- MENSAGEM -->

                <div
                    id="mensagemLogin"
                    class="mensagem-login"
                    aria-live="polite"
                ></div>


            </form>


            <!-- ==========================================
                 RODAPÉ
            =========================================== -->

            <div class="rodape-login">

                <span>
                    JUNTOS FAZEMOS A DIFERENÇA
                </span>

            </div>


            <!-- ==========================================
                 DECORAÇÃO
            =========================================== -->

            <div
                class="decoracao-login"
                aria-hidden="true"
            >

                <div class="azul"></div>

                <div class="amarelo"></div>

            </div>


        </section>


    </main>


    <!-- LOGIN JS -->

    <script src="login.js"></script>


    <!-- ==============================================
         MOSTRAR / OCULTAR SENHA
    =============================================== -->

    <script>

        const senha =
            document.getElementById("senha");

        const btnMostrarSenha =
            document.getElementById(
                "btnMostrarSenha"
            );

        const iconeOlho =
            document.getElementById(
                "iconeOlho"
            );


        btnMostrarSenha.addEventListener(
            "click",
            function () {

                if (
                    senha.type === "password"
                ) {

                    senha.type = "text";


                    btnMostrarSenha.setAttribute(
                        "aria-label",
                        "Ocultar senha"
                    );


                    btnMostrarSenha.setAttribute(
                        "title",
                        "Ocultar senha"
                    );


                    iconeOlho.innerHTML = `

                        <path
                            d="M3 3l18 18"
                        ></path>

                        <path
                            d="M10.6 10.6
                               a2 2 0 102.8 2.8"
                        ></path>

                        <path
                            d="M9.9 5.2
                               A10.8 10.8 0 0112 5
                               c6.5 0 10 7
                               10 7
                               a17.2 17.2 0 01-3.2 4.1"
                        ></path>

                        <path
                            d="M6.6 6.6
                               C3.7 8.5 2 12
                               2 12
                               s3.5 7 10 7
                               c1.1 0 2.1-.2 3-.5"
                        ></path>

                    `;

                } else {

                    senha.type = "password";


                    btnMostrarSenha.setAttribute(
                        "aria-label",
                        "Mostrar senha"
                    );


                    btnMostrarSenha.setAttribute(
                        "title",
                        "Mostrar senha"
                    );


                    iconeOlho.innerHTML = `

                        <path
                            d="M2 12s3.5-6 10-6
                               10 6 10 6
                               -3.5 6-10 6
                               -10-6-10-6z"
                        ></path>

                        <circle
                            cx="12"
                            cy="12"
                            r="2.5"
                        ></circle>

                    `;
                }

            }
        );

    </script>


</body>

</html>
